[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylockinamp"
version = "2.0.0"
description = "Python wrapper of LIA"
readme = "README.md"
license = "MIT"
authors = [
  { name = "daigokk" }
]
dependencies = [
  "numpy"
]

[project.urls]
Homepage = "https://github.com/daigokk/pylockinamp"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pylockinamp"]

[tool.setuptools.package-data]
pylockinamp = ["bin/lia.exe"]
exclude = ["pylockinamp.bin*"]
